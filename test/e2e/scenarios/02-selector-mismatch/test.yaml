# target: pod/llm-train
# namespace: cc-selector
# expect-status: Blocked
# expect-reason: RequestSelector
# The mock GPUs have 80Gi of memory; this asks for at least 120Gi.
apiVersion: v1
kind: Namespace
metadata:
  name: cc-selector
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: cc-selector
  name: big-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.example.com
          selectors:
          - cel:
              expression: "device.capacity['gpu.example.com'].memory.compareTo(quantity('120Gi')) >= 0"
---
apiVersion: v1
kind: Pod
metadata:
  namespace: cc-selector
  name: llm-train
spec:
  containers:
  - name: train
    image: registry.k8s.io/pause:3.10
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: big-gpu
