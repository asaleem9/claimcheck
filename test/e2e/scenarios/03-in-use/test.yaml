# target: pod/latecomer
# namespace: cc-in-use
# expect-status: Blocked
# expect-reason: InUse
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: cc-in-use
  name: one-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.example.com
---
apiVersion: v1
kind: Pod
metadata:
  namespace: cc-in-use
  name: latecomer
spec:
  containers:
  - name: work
    image: registry.k8s.io/pause:3.10
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: one-gpu
