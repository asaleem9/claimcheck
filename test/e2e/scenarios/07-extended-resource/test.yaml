# target: pod/legacy-train
# namespace: cc-extended
# expect-status: Blocked
# expect-reason: needs 9, 8 usable
# Requests GPUs as an extended resource, without a ResourceClaim. The
# DeviceClass maps example.com/gpu to DRA; each worker has 8.
apiVersion: v1
kind: Namespace
metadata:
  name: cc-extended
---
apiVersion: v1
kind: Pod
metadata:
  namespace: cc-extended
  name: legacy-train
spec:
  initContainers:
  - name: prep
    image: registry.k8s.io/pause:3.10
    resources:
      limits:
        example.com/gpu: 9
  containers:
  - name: train
    image: registry.k8s.io/pause:3.10
    resources:
      limits:
        example.com/gpu: 2
