# Small jobs take partitions 0 and 1 of every GPU on both workers, leaving
# two free partitions per GPU.
apiVersion: v1
kind: Namespace
metadata:
  name: cc-same-gpu
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: cc-same-gpu
  name: two-partitions
spec:
  spec:
    devices:
      requests:
      - name: slices
        exactly:
          deviceClassName: gpu.example.com
          allocationMode: All
          selectors:
          - cel:
              expression: "device.attributes['gpu.example.com'].?partition.orValue(99) < 2"
---
apiVersion: v1
kind: Pod
metadata:
  namespace: cc-same-gpu
  name: small-jobs-general
spec:
  nodeSelector:
    pool: general
  containers:
  - name: work
    image: registry.k8s.io/pause:3.10
    resources:
      claims:
      - name: slices
  resourceClaims:
  - name: slices
    resourceClaimTemplateName: two-partitions
---
apiVersion: v1
kind: Pod
metadata:
  namespace: cc-same-gpu
  name: small-jobs-training
spec:
  nodeSelector:
    pool: training
  containers:
  - name: work
    image: registry.k8s.io/pause:3.10
    resources:
      claims:
      - name: slices
  resourceClaims:
  - name: slices
    resourceClaimTemplateName: two-partitions
