# Demo cluster state for docs/demo.tape (kind cluster from hack/kind/up.sh):
# another team's job holds 6 of the 8 GPUs on claimcheck-worker, and an admin
# has tainted every GPU on claimcheck-worker2 for a driver upgrade.
apiVersion: v1
kind: Namespace
metadata:
  name: ml
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: ml
  name: six-gpus
spec:
  spec:
    devices:
      requests:
      - name: gpus
        exactly:
          deviceClassName: gpu.example.com
          count: 6
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ml
  name: finetune
spec:
  nodeSelector:
    pool: general
  containers:
  - name: train
    image: registry.k8s.io/pause:3.10
    resources:
      claims:
      - name: gpus
  resourceClaims:
  - name: gpus
    resourceClaimTemplateName: six-gpus
---
apiVersion: resource.k8s.io/v1
kind: DeviceTaintRule
metadata:
  name: driver-upgrade-worker2
spec:
  deviceSelector:
    driver: gpu.example.com
    pool: claimcheck-worker2
  taint:
    key: example.com/maintenance
    value: driver-upgrade
    effect: NoSchedule
