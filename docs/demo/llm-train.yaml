apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  namespace: ml
  name: four-gpus
spec:
  spec:
    devices:
      requests:
      - name: gpus
        exactly:
          deviceClassName: gpu.example.com
          count: 4
          selectors:
          - cel:
              expression: "device.capacity['gpu.example.com'].memory.compareTo(quantity('80Gi')) >= 0"
---
apiVersion: v1
kind: Pod
metadata:
  namespace: ml
  name: llm-train
spec:
  containers:
  - name: train
    image: registry.k8s.io/pause:3.10
    resources:
      claims:
      - name: gpus
  resourceClaims:
  - name: gpus
    resourceClaimTemplateName: four-gpus
