apiVersion: claimcheck.dev/v1alpha1
deviceClasses:
- metadata:
    name: gpu.example.com
  spec:
    selectors:
    - cel:
        expression: device.driver == "gpu.example.com"
deviceTaintRules:
- metadata:
    name: maintenance-worker-b
  spec:
    deviceSelector:
      driver: gpu.example.com
      pool: worker-b
    taint:
      effect: NoSchedule
      key: example.com/maintenance
      value: driver-upgrade
  status: {}
kind: Snapshot
metadata:
  capturedAt: null
nodes:
- metadata:
    labels:
      kubernetes.io/hostname: control-plane
      node-role.kubernetes.io/control-plane: ""
    name: control-plane
  spec: {}
  status:
    daemonEndpoints:
      kubeletEndpoint:
        Port: 0
    nodeInfo:
      architecture: ""
      bootID: ""
      containerRuntimeVersion: ""
      kernelVersion: ""
      kubeProxyVersion: ""
      kubeletVersion: ""
      machineID: ""
      operatingSystem: ""
      osImage: ""
      systemUUID: ""
- metadata:
    labels:
      kubernetes.io/hostname: worker-a
      pool: general
    name: worker-a
  spec: {}
  status:
    daemonEndpoints:
      kubeletEndpoint:
        Port: 0
    nodeInfo:
      architecture: ""
      bootID: ""
      containerRuntimeVersion: ""
      kernelVersion: ""
      kubeProxyVersion: ""
      kubeletVersion: ""
      machineID: ""
      operatingSystem: ""
      osImage: ""
      systemUUID: ""
- metadata:
    labels:
      kubernetes.io/hostname: worker-b
      pool: training
    name: worker-b
  spec: {}
  status:
    daemonEndpoints:
      kubeletEndpoint:
        Port: 0
    nodeInfo:
      architecture: ""
      bootID: ""
      containerRuntimeVersion: ""
      kernelVersion: ""
      kubeProxyVersion: ""
      kubeletVersion: ""
      machineID: ""
      operatingSystem: ""
      osImage: ""
      systemUUID: ""
pods:
- metadata:
    name: llm-train
    namespace: ml
    uid: uid-pod-llm-train
  spec:
    containers: null
    resourceClaims:
    - name: llm-train-gpu
      resourceClaimName: llm-train-gpu
  status:
    phase: Pending
resourceClaims:
- metadata:
    name: llm-train-gpu
    namespace: ml
    uid: uid-ml-llm-train-gpu
  spec:
    devices:
      requests:
      - exactly:
          allocationMode: ExactCount
          count: 1
          deviceClassName: gpu.example.com
          selectors:
          - cel:
              expression: device.attributes["gpu.example.com"].model == "H100"
          tolerations:
          - effect: NoSchedule
            key: example.com/maintenance
            operator: Exists
        name: gpu
  status: {}
resourceSlices:
- metadata:
    name: worker-a-gpu.example.com
  spec:
    devices:
    - attributes:
        model:
          string: L40S
      capacity:
        memory:
          value: 40Gi
      name: gpu-0
    - attributes:
        model:
          string: L40S
      capacity:
        memory:
          value: 40Gi
      name: gpu-1
    - attributes:
        model:
          string: L40S
      capacity:
        memory:
          value: 40Gi
      name: gpu-2
    - attributes:
        model:
          string: L40S
      capacity:
        memory:
          value: 40Gi
      name: gpu-3
    driver: gpu.example.com
    nodeName: worker-a
    pool:
      generation: 0
      name: worker-a
      resourceSliceCount: 1
- metadata:
    name: worker-b-gpu.example.com
  spec:
    devices:
    - attributes:
        model:
          string: H100
      capacity:
        memory:
          value: 80Gi
      name: gpu-0
    - attributes:
        model:
          string: H100
      capacity:
        memory:
          value: 80Gi
      name: gpu-1
    - attributes:
        model:
          string: L40S
      capacity:
        memory:
          value: 40Gi
      name: gpu-2
    - attributes:
        model:
          string: L40S
      capacity:
        memory:
          value: 40Gi
      name: gpu-3
    driver: gpu.example.com
    nodeName: worker-b
    pool:
      generation: 0
      name: worker-b
      resourceSliceCount: 1
