apiVersion: claimcheck.dev/v1alpha1
deviceClasses:
- metadata:
    name: gpu.example.com
  spec:
    selectors:
    - cel:
        expression: device.driver == "gpu.example.com"
kind: Snapshot
metadata:
  capturedAt: null
nodes:
- metadata:
    labels:
      kubernetes.io/hostname: worker
    name: worker
  spec: {}
  status:
    daemonEndpoints:
      kubeletEndpoint:
        Port: 0
    nodeInfo:
      architecture: ""
      bootID: ""
      containerRuntimeVersion: ""
      kernelVersion: ""
      kubeProxyVersion: ""
      kubeletVersion: ""
      machineID: ""
      operatingSystem: ""
      osImage: ""
      systemUUID: ""
pods:
- metadata:
    name: spread-train
    namespace: ml
    uid: uid-pod-spread-train
  spec:
    containers: null
    resourceClaims:
    - name: spread
      resourceClaimName: spread
  status:
    phase: Pending
resourceClaims:
- metadata:
    name: spread
    namespace: ml
    uid: uid-ml-spread
  spec:
    devices:
      constraints:
      - distinctAttribute: gpu.example.com/nvlink
      requests:
      - exactly:
          allocationMode: ExactCount
          count: 3
          deviceClassName: gpu.example.com
        name: gpus
  status: {}
resourceSlices:
- metadata:
    name: worker-gpu.example.com
  spec:
    devices:
    - attributes:
        model:
          string: H100
        nvlink:
          string: domain-a
      capacity:
        memory:
          value: 80Gi
      name: gpu-0
    - attributes:
        model:
          string: H100
        nvlink:
          string: domain-b
      capacity:
        memory:
          value: 80Gi
      name: gpu-1
    - attributes:
        model:
          string: H100
        nvlink:
          string: domain-b
      capacity:
        memory:
          value: 80Gi
      name: gpu-2
    - attributes:
        model:
          string: H100
      capacity:
        memory:
          value: 80Gi
      name: gpu-3
    driver: gpu.example.com
    nodeName: worker
    pool:
      generation: 0
      name: worker
      resourceSliceCount: 1
