apiVersion: claimcheck.dev/v1alpha1
deviceClasses:
- metadata:
    name: gpu.example.com
  spec:
    selectors:
    - cel:
        expression: device.driver == "gpu.example.com"
kind: Snapshot
metadata:
  capturedAt: null
nodes:
- metadata:
    labels:
      kubernetes.io/hostname: worker
    name: worker
  spec: {}
  status:
    daemonEndpoints:
      kubeletEndpoint:
        Port: 0
    nodeInfo:
      architecture: ""
      bootID: ""
      containerRuntimeVersion: ""
      kernelVersion: ""
      kubeProxyVersion: ""
      kubeletVersion: ""
      machineID: ""
      operatingSystem: ""
      osImage: ""
      systemUUID: ""
pods:
- metadata:
    name: trainer
    namespace: ml
    uid: uid-pod-trainer
  spec:
    containers: null
    resourceClaims:
    - name: net
      resourceClaimName: net
  status:
    phase: Pending
resourceClaims:
- metadata:
    name: net
    namespace: ml
    uid: uid-ml-net
  spec:
    devices:
      requests:
      - exactly:
          allocationMode: ExactCount
          capacity:
            requests:
              bandwidth: 4G
          count: 1
          deviceClassName: gpu.example.com
          selectors:
          - cel:
              expression: device.attributes["gpu.example.com"].model == "NIC"
        name: net
  status: {}
- metadata:
    name: llm-a-net
    namespace: serving
    uid: uid-serving-llm-a-net
  spec:
    devices:
      requests:
      - exactly:
          allocationMode: ExactCount
          capacity:
            requests:
              bandwidth: 4G
          count: 1
          deviceClassName: gpu.example.com
        name: net
  status:
    allocation:
      devices:
        results:
        - consumedCapacity:
            bandwidth: 4G
          device: nic-0
          driver: gpu.example.com
          pool: worker-shared
          request: net
          shareID: share-serving-llm-a-net
      nodeSelector:
        nodeSelectorTerms:
        - matchFields:
          - key: metadata.name
            operator: In
            values:
            - worker
- metadata:
    name: llm-b-net
    namespace: serving
    uid: uid-serving-llm-b-net
  spec:
    devices:
      requests:
      - exactly:
          allocationMode: ExactCount
          capacity:
            requests:
              bandwidth: 4G
          count: 1
          deviceClassName: gpu.example.com
        name: net
  status:
    allocation:
      devices:
        results:
        - consumedCapacity:
            bandwidth: 4G
          device: nic-0
          driver: gpu.example.com
          pool: worker-shared
          request: net
          shareID: share-serving-llm-b-net
      nodeSelector:
        nodeSelectorTerms:
        - matchFields:
          - key: metadata.name
            operator: In
            values:
            - worker
resourceSlices:
- metadata:
    name: worker-shared
  spec:
    devices:
    - allowMultipleAllocations: true
      attributes:
        model:
          string: NIC
      capacity:
        bandwidth:
          requestPolicy:
            default: 1G
            validRange:
              max: 8G
              min: 1G
              step: 1G
          value: 10G
      name: nic-0
    driver: gpu.example.com
    nodeName: worker
    pool:
      generation: 0
      name: worker-shared
      resourceSliceCount: 1
