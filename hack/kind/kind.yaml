# kind cluster for claimcheck's end-to-end tests: one control plane and two
# workers. DRA is GA in Kubernetes v1.37, so only CDI needs enabling for the
# example driver's mock GPUs.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri"]
    enable_cdi = true
nodes:
- role: control-plane
- role: worker
  labels:
    pool: general
- role: worker
  labels:
    pool: training
