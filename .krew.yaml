apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: claimcheck
spec:
  version: {{ .TagName }}
  homepage: https://github.com/asaleem9/claimcheck
  shortDescription: Explain why DRA can't allocate devices to a pod
  description: |
    claimcheck replays kube-scheduler's own Dynamic Resource Allocation
    allocator against your cluster and explains, device by device, why a
    ResourceClaim can't be allocated: failing CEL selectors with the actual
    attribute values, devices held by other claims, device taints, constraint
    and shared-counter conflicts, and requests that compete for the same
    devices. It can also suggest the single change that would let a pod fit,
    show pool fragmentation, and run offline from a snapshot file. Read-only.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{ addURIAndSha "https://github.com/asaleem9/claimcheck/releases/download/{{ .TagName }}/kubectl-claimcheck_linux_amd64.tar.gz" .TagName }}
    bin: kubectl-claimcheck
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{ addURIAndSha "https://github.com/asaleem9/claimcheck/releases/download/{{ .TagName }}/kubectl-claimcheck_linux_arm64.tar.gz" .TagName }}
    bin: kubectl-claimcheck
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{ addURIAndSha "https://github.com/asaleem9/claimcheck/releases/download/{{ .TagName }}/kubectl-claimcheck_darwin_amd64.tar.gz" .TagName }}
    bin: kubectl-claimcheck
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{ addURIAndSha "https://github.com/asaleem9/claimcheck/releases/download/{{ .TagName }}/kubectl-claimcheck_darwin_arm64.tar.gz" .TagName }}
    bin: kubectl-claimcheck
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{ addURIAndSha "https://github.com/asaleem9/claimcheck/releases/download/{{ .TagName }}/kubectl-claimcheck_windows_amd64.zip" .TagName }}
    bin: kubectl-claimcheck.exe
